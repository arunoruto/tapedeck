# Copy to ~/.config/tapedeck/config.toml. Full reference: https://arunoruto.github.io/tapedeck/configuration.html
# Every key can also come from the environment: TAPEDECK_LIBRARY, TAPEDECK_SYNC__PLEX__TOKEN_FILE, … (one __ per level).

library = "/srv/music"

# Lidarr-style template, relative to `library`.
# Tokens: {artist} {album_artist} {album} {year} {track} {track:02} {title} {ext}
path_template = "{album_artist}/{album} ({year})/{track:02} - {title}.{ext}"

# playlist_dir = "/srv/music/playlists"            # m3u8 files; default <library>/playlists
# theme = "catppuccin-mocha"                        # TUI colours: catppuccin-mocha, catppuccin-latte, or themes/<name>.toml next to this file
# database     = "~/.local/share/tapedeck/tapedeck.db"
# socket       = "$XDG_RUNTIME_DIR/tapedeck.sock"

[listenbrainz]
user = "your-listenbrainz-name"
# token = "..."                                     # only for private playlists
# token_file = "/run/secrets/listenbrainz-token"    # alternative to token: read it from a file
playlists = ["weekly-jams", "weekly-exploration"]  # also: daily-jams

[download]
backend = "ytdlp"
format = "opus"           # anything yt-dlp --audio-format accepts
# ytdlp_bin = "yt-dlp"
# ffmpeg_bin = "/usr/bin/ffmpeg"  # passed to yt-dlp as --ffmpeg-location; default: ffmpeg on PATH

[sync]
interval = "6h"           # daemon sync cadence: 30m, 6h, 1d
targets = ["plex"]
# on_start = true              # sync right when the daemon starts (and after restarts); false waits one interval
# playlist_title = "{name}"   # name on the targets; {name} = "Weekly Jams", {kind} = "weekly-jams"

[sync.plex]
url = "http://plex.local:32400"
token = "your-plex-token"
# token_file = "/run/secrets/plex-token"           # instead of token; sops-nix / agenix friendly
section = "Music"
# How Plex sees the library if it runs in a container or on another host:
# path_map = { "/srv/music" = "/music" }

# [lyrics]                                          # from LRCLIB, on by default; .lrc/.txt next to own tracks, database for Subsonic
# external = "db-only"                              # or "missing-sidecars" to write next to Lidarr files too
# interval = "6h"                                   # daemon pass; "0" off

# [steam]                                           # game soundtracks from Steam, tags trusted, no MusicBrainz; see the docs
# path = "/home/you/.local/share/Steam/steamapps/music"   # what the Steam client installed
# username = "you"                                  # steamcmd account (log in once by hand); owned soundtracks are downloaded
# interval = "24h"                                  # daemon check; "0" off

# [external]                                        # read-only libraries (Lidarr); recordings found there are never downloaded
# paths = ["/srv/music/releases"]
# scan_interval = "1h"                              # daemon rescans on its own clock; "0" = only at sync
# prefer_external = "ask"                           # auto: replace own copies; ask: report them; never

# [telegram]                                        # song requests from a Telegram chat
# token_file = "/run/secrets/tapedeck/telegram-token"
# allowed_users = [123456789]

# [server]                                          # HTTP API for td on other machines
# listen = "0.0.0.0:8687"
# [server.subsonic]                                 # sign-in for Subsonic clients (cliamp, Symfonium, …); without it they are anonymous
# user = "mirza"
# password_file = "/run/secrets/subsonic-password"
# anonymous = ["read", "stream", "listen"]          # without a token; add "request" and/or "sync" if you like
# token_file = "/run/secrets/tapedeck/api-token"    # optional admin token

# [remote]                                          # on a laptop: use that daemon instead of a local database
# url = "http://sado:8687"
# token_file = "/home/you/.config/tapedeck/api-token"   # only for admin commands

# [player]
# mpv_bin = "mpv"                                   # playback in the TUI
# scrobble = true                                   # report plays to ListenBrainz (the daemon submits)
