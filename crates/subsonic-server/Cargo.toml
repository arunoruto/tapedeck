[package]
name = "subsonic-server"
version = "0.1.0"
edition = "2024"
description = "Serve any music library to Subsonic clients: implement one trait, mount one axum router"
license = "MIT"
repository = "https://github.com/arunoruto/tapedeck"
readme = "README.md"
keywords = ["subsonic", "opensubsonic", "music", "axum"]
categories = ["multimedia::audio", "web-programming::http-server"]
# Grown inside tapedeck; not on crates.io yet.
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
md-5 = "0.10"
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
http-body-util = "0.1"
