[package]
name = "tapedeck"
version = "0.1.0"
edition = "2024"
description = "Pull ListenBrainz playlists, download the tracks, file them into a tagged library, sync to Plex"
license = "MIT"
repository = "https://github.com/arunoruto/tapedeck"

[[bin]]
name = "td"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
lofty = "0.25.4"
ratatui = { version = "0.30.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs"] }
tokio-stream = "0.1"
toml = "1.1.8"
md-5 = "0.10"
serde_urlencoded = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
