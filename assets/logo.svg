<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 160" width="256" height="160" role="img" aria-label="tapedeck">
  <defs>
    <clipPath id="label"><rect x="26" y="24" width="204" height="82" rx="10"/></clipPath>
  </defs>
  <!-- shell -->
  <rect x="8" y="8" width="240" height="144" rx="20" fill="#2b3140"/>
