  <circle cx="162" cy="76" r="12" fill="#6b4a30"/>
  <circle cx="94" cy="76" r="7" fill="#f4efe6"/>
  <circle cx="162" cy="76" r="7" fill="#f4efe6"/>
  <!-- bottom guide -->
