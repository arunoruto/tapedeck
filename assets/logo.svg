    <rect x="26" y="34" width="204" height="7" fill="#f0a63a"/>
    <rect x="26" y="41" width="204" height="4" fill="#3aa6a0"/>
  </g>
  <!-- window, tape and reels -->
  <rect x="60" y="56" width="136" height="40" rx="20" fill="#2b3140"/>
  <path d="M94 60 L162 64 L162 88 L94 92 Z" fill="#6b4a30"/>
