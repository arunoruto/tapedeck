name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Network tests are #[ignore]d for offline builds; CI has network, so run them too.
      - run: cargo test --workspace -- --include-ignored

  nix:
    name: nix build (${{ matrix.os }})
    # x86_64-linux for the NAS, aarch64-darwin for the MacBook; both land in the cache.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: arunoruto
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only main gets pushed to the cache; PRs just build.
          skipPush: ${{ github.event_name == 'pull_request' }}
      - run: nix build -L .#tapedeck
      - run: nix flake check
        if: runner.os == 'Linux'
      - name: Store paths (for the cache announcement)
        run: |
          echo "wrapper   $(nix path-info .#tapedeck)"
          echo "unwrapped $(nix path-info .#tapedeck-unwrapped)"
